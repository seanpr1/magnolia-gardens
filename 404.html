<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found · Magnolia Gardens Landscaping</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --surface:  #FAF6EA;
    --panel:    #EDE5D2;
    --edge:     #D6CFC0;
    --bright:   #1F1D18;
    --body:     #2A2823;
    --muted:    #5C574E;
    --gold:     #005343;
    --accent:   #C8A04A;
    --serif:    'Fraunces', 'Hoefler Text', Garamond, serif;
    --sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--surface);
    color: var(--body);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 480px; text-align: center; }
  .code {
    font-family: var(--serif);
    font-size: 72px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 26px;
    color: var(--bright);
    margin-bottom: 12px;
  }
  p { color: var(--muted); font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block;
    padding: 13px 26px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--edge);
    color: var(--body);
    background: var(--panel);
  }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: var(--surface); }
  .phone { margin-top: 26px; font-size: 14px; color: var(--muted); }
  .phone a { color: var(--gold); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>That page didn't take root</h1>
    <p>The page you're looking for doesn't exist or has moved. The lawn care, though, is right where you left it.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn" href="/estimate/">Get an instant estimate</a>
    </div>
    <div class="phone">Or text your address to <a href="sms:+14233909954">423-390-9954</a> for a fast quote, typically same day</div>
  </div>
</body>
</html>
