# The same offline build/static/form checks used on a fresh clone.
# Seasonal runs intentionally report stale seasonal content.
name: Site check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 3,5,9,12 *"   # Mar 1, May 1, Sep 1, Dec 1 at 13:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned npm
        run: npm install --global npm@12.1.0
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Run offline website checks
        run: npm test
