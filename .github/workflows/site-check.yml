# Static-site checks: JSON-LD, FAQ parity, seasonal hero copy, meta lengths, internal links, sitemap.
# Runs on every push and PR, and on the 1st of each season-change month so stale seasonal copy
# fails loudly (the site has no build step, so nothing else would catch it).
name: Site check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 3,5,9,12 *"   # Mar 1, May 1, Sep 1, Dec 1 at 13:00 UTC

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site checks
        run: python3 scripts/site_check.py
